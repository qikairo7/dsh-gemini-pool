name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero runtime dependencies. devDependencies provide the optional peer
      # host packages (@deepseek-ai/*) that lib/index.js statically imports,
      # required for the test suite to load.
      - run: npm install --no-audit --no-fund
      - run: npm run check
