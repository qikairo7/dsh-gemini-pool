name: check

on:
  push:
  pull_request:

jobs:
  check:
    # ubuntu-latest 这个浮动标签将于 2026-10-19 起迁移到 Ubuntu 26，固定到具体版本以消除不确定性。
    runs-on: ubuntu-24.04
    steps:
      # checkout 与 setup-node 钉到 commit SHA，消除 mutable tag 被重指向的风
      # 险（供应链防护）；dependabot 仍会识别 SHA 对应版本并提 PR 更新。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # GitHub 已弃用 Node 20：即便声明 node-version: 20，runner 也会强制以
          # Node 24 运行并告警，故直接写 24 对齐实际版本（>=20 仍满足 engines）。
          node-version: 24
      # Zero runtime dependencies. devDependencies provide the optional peer
      # host packages (@deepseek-ai/*) that lib/index.js statically imports,
      # required for the test suite to load.
      - run: npm install --no-audit --no-fund
      - run: npm run check
