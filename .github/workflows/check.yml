name: check

on:
  push:
  pull_request:

jobs:
  check:
    # ubuntu-latest 这个浮动标签将于 2026-10-19 起迁移到 Ubuntu 26，固定到具体版本以消除不确定性。
    runs-on: ubuntu-24.04
    steps:
      # Node 20 已被弃用，checkout 与 setup-node 一起统一升到 v7。
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Node 20 已被 GitHub Actions 弃用：runner 上 v4 + node-version 20 会被
          # 强制以 Node 24 运行并告警。直接对齐实际运行版本（>=20 仍满足 engines）。
          node-version: 24
      # Zero runtime dependencies. devDependencies provide the optional peer
      # host packages (@deepseek-ai/*) that lib/index.js statically imports,
      # required for the test suite to load.
      - run: npm install --no-audit --no-fund
      - run: npm run check
