name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # This package has zero runtime dependencies, so no install step is
      # needed: `npm run check` only runs `node --check` and `node --test`.
      - run: npm run check
